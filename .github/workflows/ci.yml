name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, unit, integration and e2e
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: kaup39
          POSTGRES_PASSWORD: kaup39
          POSTGRES_DB: kaup39_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - run: yarn install --immutable

      - run: yarn typecheck

      - run: yarn lint

      - run: yarn format:check

      - run: yarn test:unit

      - run: yarn test:integration
        env:
          TEST_DATABASE_URL: postgres://kaup39:kaup39@localhost:5432/kaup39_test

      - run: yarn playwright install --with-deps chromium

      - run: yarn test:e2e
        env:
          E2E_DATABASE_URL: postgres://kaup39:kaup39@localhost:5432/kaup39_e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    # страница читает CMS: Lighthouse меряет главную на той же проверочной базе, что и e2e
    env:
      DATABASE_URL: postgres://kaup39:kaup39@localhost:5432/kaup39_e2e
      PAYLOAD_SECRET: lighthouse
      MEDIA_DIR: media-e2e
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: kaup39
          POSTGRES_PASSWORD: kaup39
          POSTGRES_DB: kaup39
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - run: yarn install --immutable

      - name: Runner CPUs
        run: nproc

      - run: yarn build:lighthouse

      - run: yarn seed:e2e

      - run: yarn test:lighthouse

      - name: CPU class and score of each run
        if: ${{ !cancelled() }}
        run: |
          node -e '
            const fs = require("node:fs");
            for (const file of fs.readdirSync(".lighthouseci").filter((name) => /^lhr-.*\.json$/.test(name))) {
              const lhr = JSON.parse(fs.readFileSync(`.lighthouseci/${file}`, "utf8"));
              const tbt = Math.round(lhr.audits["total-blocking-time"].numericValue);
              console.log(lhr.finalDisplayedUrl, "benchmarkIndex", lhr.environment.benchmarkIndex, "performance", lhr.categories.performance.score, "TBT", tbt);
            }
          '

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: lighthouse-report
          path: .lighthouseci/
          include-hidden-files: true
          retention-days: 7

  # образ собирается здесь, сервер его только запускает (D41): тег коммита ставится приложению Coolify, затем выкат
  image:
    name: Image and deploy to stand
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/nikolaymurashkin/kaup39:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Coolify
        env:
          COOLIFY_URL: https://coolify.mrshkn.com/api/v1
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          APP_UUID: ${{ vars.COOLIFY_APP_UUID }}
        run: |
          api() { curl -sS --fail-with-body -H "Authorization: Bearer $COOLIFY_TOKEN" -H 'Content-Type: application/json' "$@"; }
          api -X PATCH "$COOLIFY_URL/applications/$APP_UUID" -d "{\"docker_registry_image_tag\":\"$GITHUB_SHA\"}" > /dev/null
          deployment=$(api -X POST "$COOLIFY_URL/deploy?uuid=$APP_UUID" | jq -r '.deployments[0].deployment_uuid')
          echo "deployment $deployment"
          for _ in $(seq 60); do
            status=$(api "$COOLIFY_URL/deployments/$deployment" | jq -r .status)
            case $status in
              finished) exit 0 ;;
              failed | cancelled*) echo "status: $status"; exit 1 ;;
            esac
            sleep 10
          done
          echo "status after 10 min: $status"
          exit 1
