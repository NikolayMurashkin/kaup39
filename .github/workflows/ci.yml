name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, unit, integration and e2e
    if: false
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: kaup39
          POSTGRES_PASSWORD: kaup39
          POSTGRES_DB: kaup39_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - run: yarn install --immutable

      - run: yarn typecheck

      - run: yarn lint

      - run: yarn format:check

      - run: yarn test:unit

      - run: yarn test:integration
        env:
          TEST_DATABASE_URL: postgres://kaup39:kaup39@localhost:5432/kaup39_test

      - run: yarn playwright install --with-deps chromium

      - run: yarn test:e2e
        env:
          E2E_DATABASE_URL: postgres://kaup39:kaup39@localhost:5432/kaup39_e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lighthouse:
    name: Lighthouse CI (sample ${{ matrix.sample }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3, 4]
    # страница читает CMS: Lighthouse меряет главную на той же проверочной базе, что и e2e
    env:
      DATABASE_URL: postgres://kaup39:kaup39@localhost:5432/kaup39_e2e
      PAYLOAD_SECRET: lighthouse
      MEDIA_DIR: media-e2e
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: kaup39
          POSTGRES_PASSWORD: kaup39
          POSTGRES_DB: kaup39
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - run: yarn install --immutable

      - name: Runner CPUs
        run: nproc

      - run: yarn build:lighthouse

      - run: NEXT_DIST_DIR=.next-inline LAB_INLINE_CSS=1 yarn next build

      - run: yarn seed:e2e

      - name: Start both builds
        run: |
          NEXT_DIST_DIR=.next-production nohup yarn start -p 3202 > server-3202.log 2>&1 &
          NEXT_DIST_DIR=.next-inline nohup yarn start -p 3203 > server-3203.log 2>&1 &
          for port in 3202 3203; do
            for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:$port/ && break; sleep 2; done
            curl -sf -o /dev/null http://localhost:$port/
          done

      - run: yarn test:lighthouse

      - name: CPU class and score of each run
        if: ${{ !cancelled() }}
        run: |
          node -e '
            const fs = require("node:fs");
            for (const file of fs.readdirSync(".lighthouseci").filter((name) => /^lhr-.*\.json$/.test(name))) {
              const lhr = JSON.parse(fs.readFileSync(`.lighthouseci/${file}`, "utf8"));
              const tbt = Math.round(lhr.audits["total-blocking-time"].numericValue);
              console.log(lhr.finalDisplayedUrl, "benchmarkIndex", lhr.environment.benchmarkIndex, "performance", lhr.categories.performance.score, "TBT", tbt);
            }
          '

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: lighthouse-report-${{ matrix.sample }}
          path: .lighthouseci/
          include-hidden-files: true
          retention-days: 7
