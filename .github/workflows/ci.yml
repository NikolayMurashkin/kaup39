name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, unit, integration and e2e
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: kaup39
          POSTGRES_PASSWORD: kaup39
          POSTGRES_DB: kaup39_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - run: yarn install --immutable

      - run: yarn typecheck

      - run: yarn lint

      - run: yarn format:check

      - run: yarn test:unit

      - run: yarn test:integration
        env:
          TEST_DATABASE_URL: postgres://kaup39:kaup39@localhost:5432/kaup39_test

      - run: yarn playwright install --with-deps chromium

      - run: yarn test:e2e
        env:
          E2E_DATABASE_URL: postgres://kaup39:kaup39@localhost:5432/kaup39_e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    # страница читает CMS: Lighthouse меряет главную на той же проверочной базе, что и e2e
    env:
      DATABASE_URL: postgres://kaup39:kaup39@localhost:5432/kaup39_e2e
      PAYLOAD_SECRET: lighthouse
      MEDIA_DIR: media-e2e
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: kaup39
          POSTGRES_PASSWORD: kaup39
          POSTGRES_DB: kaup39
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - run: yarn install --immutable

      - run: yarn build:lighthouse

      - run: yarn seed:e2e

      - run: yarn test:lighthouse

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: lighthouse-report
          path: .lighthouseci/
          include-hidden-files: true
          retention-days: 7
